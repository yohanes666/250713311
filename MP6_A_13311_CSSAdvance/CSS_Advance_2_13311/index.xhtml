<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
  "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Seminar</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
    <h1>Formulir Pendaftaran Seminar</h1>

    <form action="" method="post" enctype="multipart/form-data">
        <h2>Data Peserta</h2>
        <table>
            <tr>
                <td>
                    <label for="nama"><strong>Nama Lengkap</strong></label>
                </td>
                <td>
                    <input type="text" id="nama" name="nama" size="30" />
                </td>
            </tr>
            <tr>
                <td>
                    <label for="nim"><strong>NIM</strong></label>
                </td>
                <td>
                    <input type="text" id="nim" name="nim" size="30" />
                </td>
            </tr> 
            <tr>
                <td><strong>Jenis Kelamin</strong></td>
                <td>
                    <input type="radio" id="laki" name="jk" value="Laki-Laki" />
                    <label for="laki">Laki-laki</label>
                    <input type="radio" id="perempuan" name="jk" value="Perempuan" />
                    <label for="perempuan">Perempuan</label>
                    <input type="radio" id="tidakmemberitahu" name="jk" value="Tidak Ingin Memberitahu" />
                    <label for="tidakmemberitahu">Tidak ingin memberitahu</label>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="prodi"><strong>Program Studi</strong></label>
                </td>
                <td>
                    <select id="prodi" name="prodi">
                        <option value="Informatika">Informatika</option>
                        <option value="Sistem Informasi">Sistem Informasi</option>
                        <option value="Teknik Industri">Teknik Industri</option>
                    </select>
                </td>
            </tr>
        </table>

        <h2>Pilihan Seminar</h2>
        <table>
            <tr>
                <td><strong>Jenis Tiket</strong></td>
                <td>
                    <input type="radio" id="reguler" name="tiket" value="Reguler" />
                    <label for="reguler">Reguler</label>
                    <input type="radio" id="vip" name="tiket" value="VIP" />
                    <label for="vip">VIP</label>
                    <input type="radio" id="vvip" name="tiket" value="VVIP" />
                    <label for="vvip">VVIP</label>
                </td>
            </tr>
            <tr>
                <td class="top"><strong>Topik Seminar</strong></td>
                <td>
                    <p>
                        <input type="checkbox" id="webdev" name="topik" value="Web Development" />
                        <label for="webdev">Web Development</label>
                    </p>
                    <p>
                        <input type="checkbox" id="datascience" name="topik" value="Data Science" />
                        <label for="datascience">Data Science</label>
                    </p>
                    <p>
                        <input type="checkbox" id="ai" name="topik" value="Artificial Intelligence" />
                        <label for="ai">Artificial Intelligence</label>
                    </p>
                </td>
            </tr>
        </table>

        <h2>Informasi Tambahan</h2>
        <table>
            <tr>
                <td class="top">
                    <label for="alasan"><strong>Alasan Mengikuti Seminar</strong></label>
                </td>
                <td>
                    <textarea id="alasan" name="alasan" rows="5" cols="23"></textarea>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="bukti"><strong>Bukti Pembayaran</strong></label>
                </td>
                <td>
                    <input type="file" id="bukti" name="bukti" />
                </td>
            </tr>
        </table>

        <div class="button-container">
            <input type="submit" name="simpan" value="Simpan" />
        </div>
    </form>
</body>
</html>
